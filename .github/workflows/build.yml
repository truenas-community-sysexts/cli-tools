name: Build cli-tools Sysext

# Builds cli-tools.raw and publishes it as a PRERELEASE, then opens one
# hardware-test issue per TrueNAS train in tracked-versions.json
# (`hardware-test` for a stable train, `preview-hardware-test` for a preview
# one). Closing a train's issue as completed approves the release for that
# train's boxes only (promote.yml adds a verified-train marker to its notes);
# get.sh installs only releases approved for the box's train.
# There is no publish-straight-to-Latest option: a full release with no
# verified-train marker counts as approved for every train (that is how
# releases from before per-train sign-off stay installable), so it would
# reach every box untested.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Debian suite to build apt tools against (blank = tracked)'
        required: false
        default: ''

  workflow_call:
    inputs:
      suite:
        type: string
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: build-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  SYSEXT_ROOT: /tmp/cli-tools-sysext

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.params.outputs.suite }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/tracked-versions.json
          sparse-checkout-cone-mode: false

      - name: Resolve build parameters
        id: params
        env:
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          TRACKED_SUITE=$(jq -r '.debian.suite' .github/tracked-versions.json)
          SUITE="${INPUT_SUITE:-$TRACKED_SUITE}"
          echo "suite=${SUITE}" >> "$GITHUB_OUTPUT"
          echo "Resolved: suite=${SUITE}"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Build the apt-sourced tools against the pinned Debian base so their
    # glibc is <= TrueNAS's (older glibc binaries run on newer glibc).
    container: debian:${{ needs.resolve.outputs.suite }}-slim
    outputs:
      run_number: ${{ steps.build_id.outputs.run_number }}
      build_date: ${{ steps.build_id.outputs.build_date }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl tar xz-utils bzip2 gzip unzip \
            squashfs-tools zstd patchelf jq coreutils git

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute build identifier
        id: build_id
        run: |
          echo "run_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Initialize sysext tree
        run: |
          rm -rf "${SYSEXT_ROOT}"
          mkdir -p "${SYSEXT_ROOT}/usr/bin"
          mkdir -p "${SYSEXT_ROOT}/usr/lib/cli-tools"
          mkdir -p "${SYSEXT_ROOT}/usr/lib/extension-release.d"
          # extension-release: ID=_any makes the sysext load on any distro ID,
          # which is what TrueNAS SCALE needs (its os-release ID is not 'debian').
          echo "ID=_any" > "${SYSEXT_ROOT}/usr/lib/extension-release.d/extension-release.cli-tools"
          # Manifest of command names, consumed by install.sh --check.
          : > "${SYSEXT_ROOT}/usr/lib/cli-tools/manifest.txt"
          # Human-readable record of what each tool resolved to.
          : > "${SYSEXT_ROOT}/usr/lib/cli-tools/versions.txt"

      - name: Fetch prebuilt (github/url) tools
        run: |
          TVERS=.github/tracked-versions.json

          extract_archive() {
            # extract_archive <archive> <dest_dir>
            local a="$1" d="$2"
            mkdir -p "$d"
            case "$a" in
              *.tbz|*.tar.bz2) tar -xjf "$a" -C "$d" ;;
              *.tar.gz|*.tgz)  tar -xzf "$a" -C "$d" ;;
              *.tar.xz|*.txz)  tar -xJf "$a" -C "$d" ;;
              *.zip)           unzip -q "$a" -d "$d" ;;
              *) echo "::error title=fetch::don't know how to extract ${a}" >&2; return 1 ;;
            esac
          }

          # Emit one compact JSON object per tool and pull each field with jq.
          # (A @tsv row would collapse the empty url/extract columns, since
          # read treats tab as whitespace -- shifting every later field.)
          jq -c '.tools | to_entries[]
                 | select(.value.source=="github" or .value.source=="url")
                 | {name: .key} + .value' "$TVERS" \
          | while IFS= read -r row; do
              name=$(jq -r '.name' <<<"$row")
              source=$(jq -r '.source' <<<"$row")
              version=$(jq -r '.version' <<<"$row")
              repo=$(jq -r '.repo // ""' <<<"$row")
              asset=$(jq -r '.asset // ""' <<<"$row")
              url=$(jq -r '.url // ""' <<<"$row")
              extract=$(jq -r '.extract // ""' <<<"$row")
              bin=$(jq -r '.bin' <<<"$row")
              echo "=== ${name} (${source} ${version}) ==="
              work=$(mktemp -d)
              if [ "$source" = "github" ]; then
                dl="https://github.com/${repo}/releases/download/${version}/${asset}"
                fname="$asset"
              else
                dl="$url"
                fname="$(basename "$url")"
              fi
              echo "  fetching ${dl}"
              curl -fSL --retry 3 --max-time 300 "$dl" -o "${work}/${fname}"

              if [ -z "$extract" ]; then
                # The downloaded file IS the binary.
                install -m 0755 "${work}/${fname}" "${SYSEXT_ROOT}/usr/bin/${bin}"
              else
                extract_archive "${work}/${fname}" "${work}/x"
                if [ ! -f "${work}/x/${extract}" ]; then
                  echo "::error title=fetch::${name}: '${extract}' not found in ${fname}" >&2
                  find "${work}/x" -maxdepth 3 -type f >&2 || true
                  exit 1
                fi
                install -m 0755 "${work}/x/${extract}" "${SYSEXT_ROOT}/usr/bin/${bin}"
              fi
              echo "${bin}" >> "${SYSEXT_ROOT}/usr/lib/cli-tools/manifest.txt"
              printf '%-12s %s (%s)\n' "$name" "$version" "$source" \
                >> "${SYSEXT_ROOT}/usr/lib/cli-tools/versions.txt"
              rm -rf "$work"
            done

      - name: Install + bundle apt tools
        run: |
          TVERS=.github/tracked-versions.json
          mapfile -t PKGS < <(jq -r '.tools | to_entries[]
                              | select(.value.source=="apt") | .value.package' "$TVERS")
          if [ "${#PKGS[@]}" -gt 0 ]; then
            echo "Installing apt packages: ${PKGS[*]}"
            apt-get install -y --no-install-recommends "${PKGS[@]}"
          fi

          # Bundle each apt package (binaries + private lib closure + data).
          jq -r '.tools | to_entries[]
                 | select(.value.source=="apt")
                 | [.key, .value.package] | @tsv' "$TVERS" \
          | while IFS=$'\t' read -r name package; do
              .github/scripts/bundle-apt-tool.sh \
                "${SYSEXT_ROOT}" "${package}" \
                "${SYSEXT_ROOT}/usr/lib/cli-tools/manifest.txt"
              ver=$(dpkg-query -W -f='${Version}' "$package" 2>/dev/null || echo '?')
              printf '%-12s %s (apt:%s)\n' "$name" "$ver" "$package" \
                >> "${SYSEXT_ROOT}/usr/lib/cli-tools/versions.txt"
            done

      - name: Finalize sysext tree
        run: |
          TVERS=.github/tracked-versions.json

          # Create any declared command-name symlinks (e.g. iotop -> iotop-c,
          # since the iotop-c package's binary isn't named `iotop` and its
          # alternatives symlink lives in /etc, which a sysext doesn't merge).
          jq -r '.tools | to_entries[]
                 | select(.value.links != null)
                 | .value.links | to_entries[]
                 | [.key, .value] | @tsv' "$TVERS" \
          | while IFS=$'\t' read -r linkname target; do
              # Place the link next to its target, in whichever dir it landed.
              for d in usr/bin usr/sbin; do
                if [ -e "${SYSEXT_ROOT}/${d}/${target}" ]; then
                  ln -sf "$target" "${SYSEXT_ROOT}/${d}/${linkname}"
                  echo "${linkname}" >> "${SYSEXT_ROOT}/usr/lib/cli-tools/manifest.txt"
                  echo "  link: ${d}/${linkname} -> ${target}"
                  break
                fi
              done
            done

          # Bundle the PREINIT script so install.sh can extract it from the .raw.
          install -m 0755 scripts/cli-tools-preinit.sh \
            "${SYSEXT_ROOT}/usr/lib/cli-tools/cli-tools-preinit.sh"

          # De-duplicate and sort the manifest (apt packages can ship helper
          # binaries like mtr-packet that land alongside the headline tool).
          sort -u -o "${SYSEXT_ROOT}/usr/lib/cli-tools/manifest.txt" \
                     "${SYSEXT_ROOT}/usr/lib/cli-tools/manifest.txt"

          echo "=== Manifest (commands) ==="
          cat "${SYSEXT_ROOT}/usr/lib/cli-tools/manifest.txt"
          echo "=== Versions ==="
          sort "${SYSEXT_ROOT}/usr/lib/cli-tools/versions.txt"
          echo "=== Tree ==="
          find "${SYSEXT_ROOT}" -type f -o -type l | sort

      - name: Create cli-tools.raw squashfs
        run: |
          # -all-root: the runner assembles the tree as the container user, but
          # the sysext is merged as root on the target. Own files as root.
          mksquashfs "${SYSEXT_ROOT}" cli-tools.raw -noappend -comp zstd -all-root
          echo "=== cli-tools.raw ==="
          ls -lh cli-tools.raw
          unsquashfs -l cli-tools.raw | head -60

      - name: Smoke-test cli-tools.raw contents
        run: |
          SMOKE=$(mktemp -d)
          trap 'rm -rf "$SMOKE"' EXIT
          unsquashfs -d "${SMOKE}/x" cli-tools.raw

          fail=0
          # extension-release sanity
          EXT="${SMOKE}/x/usr/lib/extension-release.d/extension-release.cli-tools"
          if [ ! -f "$EXT" ] || ! grep -qx 'ID=_any' "$EXT"; then
            echo "::error title=smoke::extension-release.cli-tools missing or not ID=_any" >&2
            fail=1
          fi
          # PREINIT bundled
          if [ ! -x "${SMOKE}/x/usr/lib/cli-tools/cli-tools-preinit.sh" ]; then
            echo "::error title=smoke::cli-tools-preinit.sh missing from sysext" >&2
            fail=1
          fi
          # Every manifest command must exist as an executable under usr/bin or usr/sbin.
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            if [ -x "${SMOKE}/x/usr/bin/${cmd}" ] || [ -x "${SMOKE}/x/usr/sbin/${cmd}" ]; then
              echo "  ok: ${cmd}"
            else
              echo "::error title=smoke::manifest lists '${cmd}' but no executable under usr/bin or usr/sbin" >&2
              fail=1
            fi
          done < "${SMOKE}/x/usr/lib/cli-tools/manifest.txt"

          # Best-effort: each headline binary should at least run --version
          # in this container (libs are present here). Not a hard failure --
          # some tools have no --version and exit non-zero.
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            bin="${SMOKE}/x/usr/bin/${cmd}"
            [ -x "$bin" ] || bin="${SMOKE}/x/usr/sbin/${cmd}"
            if "$bin" --version >/dev/null 2>&1 || "$bin" -V >/dev/null 2>&1; then
              echo "  runs: ${cmd}"
            else
              echo "  (note) ${cmd} did not respond to --version/-V"
            fi
          done < "${SMOKE}/x/usr/lib/cli-tools/manifest.txt"

          if [ "$fail" -ne 0 ]; then
            echo "::error title=smoke::cli-tools.raw failed validation, refusing to publish" >&2
            exit 1
          fi
          echo "smoke-test OK"

      - name: Generate checksum
        run: |
          sha256sum cli-tools.raw > cli-tools.raw.sha256
          cat cli-tools.raw.sha256

      - name: Render release notes
        env:
          SUITE: ${{ needs.resolve.outputs.suite }}
          BUILD_DATE: ${{ steps.build_id.outputs.build_date }}
          RUN_NUMBER: ${{ steps.build_id.outputs.run_number }}
          BUILD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          TAG="v${BUILD_DATE}-r${RUN_NUMBER}"
          GET="https://raw.githubusercontent.com/${REPO}/main/get.sh"
          TRAINS=$(jq -r '[.trains[].name] | join(", ")' .github/tracked-versions.json)
          {
            echo "## cli-tools sysext for TrueNAS SCALE"
            echo ""
            echo "A bundle of common CLI utilities not shipped in stock TrueNAS SCALE,"
            echo "merged into \`/usr\` via systemd-sysext. Kernel-independent: this single"
            echo "release works on every TrueNAS version."
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Built (UTC) | \`${BUILD_DATE}\` |"
            echo "| apt base | Debian \`${SUITE}\` |"
            echo "| Source commit | [\`${BUILD_SHA}\`](https://github.com/${REPO}/commit/${BUILD_SHA}) |"
            echo ""
            echo "### Included tools"
            echo '```'
            sort "${SYSEXT_ROOT}/usr/lib/cli-tools/versions.txt"
            echo '```'
            echo ""
            echo "This release starts as a pre-release. A hardware test on a TrueNAS train (${TRAINS})"
            echo "approves it for that train's boxes only; until then the one-liner keeps installing the"
            echo "newest release approved for each train."
            echo ""
            echo "### Install"
            echo "The newest release approved for your TrueNAS train:"
            echo '```bash'
            echo "curl -fsSL ${GET} | sudo bash"
            echo '```'
            echo "This exact release:"
            echo '```bash'
            echo "curl -fsSL ${GET} | sudo bash -s -- --release=${TAG}"
            echo '```'
            echo ""
            echo "### Verify"
            echo '```bash'
            echo "curl -fsSL ${GET} | sudo bash -s -- --check"
            echo '```'
            echo ""
            echo "### Uninstall"
            echo '```bash'
            echo "curl -fsSL ${GET} | sudo bash -s -- --uninstall"
            echo '```'
            echo ""
            echo "### Checksum"
            echo "See \`cli-tools.raw.sha256\`."
          } > release-notes.md
          echo "=== Rendered release notes ==="
          cat release-notes.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-tools-sysext-${{ steps.build_id.outputs.build_date }}-r${{ steps.build_id.outputs.run_number }}
          path: |
            cli-tools.raw
            cli-tools.raw.sha256
            release-notes.md

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      # scripts/ for the release assets, .github/ for tracked-versions.json
      # (the trains the hardware-test issues are opened for).
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            .github
          sparse-checkout-cone-mode: true

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: cli-tools-sysext-${{ needs.build.outputs.build_date }}-r${{ needs.build.outputs.run_number }}

      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.build_date }}-r${{ needs.build.outputs.run_number }}
          name: "cli-tools ${{ needs.build.outputs.build_date }} (r${{ needs.build.outputs.run_number }})"
          body_path: release-notes.md
          files: |
            cli-tools.raw
            cli-tools.raw.sha256
            scripts/cli-tools-lib.sh
            scripts/install.sh
            scripts/restore.sh
            scripts/uninstall.sh
          # Draft first so assets attach even on immutable-release repos.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the draft as a prerelease, always: it is approved per train
      # only by that train's hardware-test issue (promote.yml).
      - name: Publish the draft as a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REL_ID: ${{ steps.release.outputs.id }}
        run: gh api --method PATCH "repos/${REPO}/releases/${REL_ID}" -F draft=false -F prerelease=true

      - name: Open hardware-test issues, one per train (prerelease gate)
        uses: actions/github-script@v9
        env:
          BUILD_DATE: ${{ needs.build.outputs.build_date }}
          RUN_NUMBER: ${{ needs.build.outputs.run_number }}
        with:
          script: |
            const tag = `v${process.env.BUILD_DATE}-r${process.env.RUN_NUMBER}`;
            const { owner, repo } = context.repo;
            const releaseUrl = `https://github.com/${owner}/${repo}/releases/tag/${tag}`;
            const fs = require('fs');
            // One issue per supported TrueNAS train: a hardware test approves this
            // release for its own train's boxes only (promote.yml). Stable trains use
            // the hardware-test label, preview (beta) trains preview-hardware-test.
            const { trains } = JSON.parse(fs.readFileSync('.github/tracked-versions.json', 'utf8'));
            const labelOf = (t) => (t.channel === 'preview' ? 'preview-hardware-test' : 'hardware-test');
            const labels = {
              'hardware-test': { color: 'FBCA04',
                description: 'Build awaiting verification on real hardware' },
              'preview-hardware-test': { color: '5319E7',
                description: 'Build awaiting verification on real hardware, on a TrueNAS preview (beta) train' },
            };
            for (const name of new Set(trains.map(labelOf))) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, ...labels[name] });
              } catch (e) { if (e.status !== 422) throw e; }
            }
            // Duplicate check, keyed on tag AND train: an open issue whose markers
            // (or title) name both already covers the pair. An open issue for this tag
            // with no train marker and no train in its title is the single issue from
            // before per-train sign-off: it covered every train (promote.yml still
            // approves it for all of them), so it suppresses them all.
            const open = [];
            for (const name of Object.keys(labels)) {
              open.push(...(await github.rest.issues.listForRepo({ owner, repo,
                state: 'open', labels: name, per_page: 100 })).data);
            }
            const issueTag = (i) => ((i.body || '').match(/<!--\s*release-tag:\s*(\S+?)\s*-->/) || [])[1] || '';
            const issueTrain = (i) => ((i.body || '').match(/<!--\s*train:\s*(\S+?)\s*-->/) || [])[1] || '';
            const covers = (i, t) => {
              if (issueTag(i) !== tag && !i.title.endsWith(` ${tag}`)) return false;
              if (issueTrain(i)) return issueTrain(i) === t.key;
              const named = trains.find((x) => i.title.includes(`| any ${x.name} system,`));
              return named ? named.key === t.key : true;
            };
            // Test instructions. Every command must work exactly as written on a
            // TrueNAS box: a human validator pastes them. The one-liner runs main's
            // get.sh (what users run); --release makes it run this release's
            // install.sh, which then downloads this release's cli-tools.raw.
            const inst = `https://raw.githubusercontent.com/${owner}/${repo}/main/get.sh`;
            for (const t of trains) {
              const preview = t.channel === 'preview';
              // Title: what to test | on what | which build. The train names the "on
              // what"; the tag goes last, verbatim.
              const title = `${preview ? 'Preview hardware test' : 'Hardware test'}: cli-tools ${process.env.BUILD_DATE} | any ${t.name} system, no special hardware | ${tag}`;
              const dup = open.find((i) => covers(i, t));
              if (dup) {
                console.log(`Open issue #${dup.number} already covers ${tag} on ${t.name}, skipping`);
                continue;
              }
              const others = trains.filter((x) => x.key !== t.key).map((x) => x.name);
              await github.rest.issues.create({ owner, repo, title, labels: [labelOf(t)],
                body: [
                  `CI built and smoke-tested this release. This issue approves it for **${t.name}** boxes only: verify it **on real hardware, on a ${t.name} box**.${others.length ? ` ${others.join(', ')} ${others.length > 1 ? 'have their own issues' : 'has its own issue'} for this release.` : ''}`,
                  ``,
                  `**Release:** [${tag}](${releaseUrl})`,
                  `**Train:** ${t.name} (\`cat /etc/version\` starts with \`${t.key}.\`)`,
                  `<!-- release-tag: ${tag} -->`,
                  `<!-- train: ${t.key} -->`,
                  ``,
                  `### Requirements`,
                  `- A ${t.name} box with a data pool. Userspace only (no kernel module), so one build serves every train, but each train signs it off on its own.`,
                  `- No special hardware.`,
                  ``,
                  `### 1. Pre-checks`,
                  "```bash",
                  `cat /etc/version                       # starts with ${t.key}. (this issue's train)`,
                  `sudo zpool list -H -o name             # at least one pool besides boot-pool`,
                  "```",
                  ``,
                  `### 2. Install this build`,
                  `No hardware test has approved it for ${t.name} yet, so plain \`get.sh\` would install the newest approved release instead. Pin this build with \`--release\`:`,
                  "```bash",
                  `I=${inst}`,
                  `curl -fsSL "$I" | sudo bash -s -- --release=${tag} --dry-run   # "Downloading cli-tools.raw from ${owner}/${repo} release ${tag}...", "Checksum OK", "=== Dry-run complete ==="`,
                  `curl -fsSL "$I" | sudo bash -s -- --release=${tag}             # add --pool=NAME if it asks; lists "Tools now on PATH:"`,
                  "```",
                  ``,
                  `### 3. Verify`,
                  "```bash",
                  `curl -fsSL "$I" | sudo bash -s -- --release=${tag} --check   # "All bundled tools resolve on PATH", 0 fail (PREINIT only warns until step 4)`,
                  `cat /usr/lib/cli-tools/versions.txt    # matches "Included tools" in the release notes`,
                  `for t in btop ncdu yq tree mtr nmap; do "$t" --version </dev/null | head -1; done   # one version line each`,
                  `sudo sh -c 'for t in $(cat /usr/lib/cli-tools/manifest.txt); do ldd "$(command -v "$t")" 2>/dev/null | grep "not found"; done'   # prints nothing: every bundled lib resolves`,
                  "```",
                  ``,
                  `### 4. Reboot and re-verify`,
                  "```bash",
                  `sudo reboot`,
                  "```",
                  `After it is back up:`,
                  "```bash",
                  `I=${inst}`,
                  `curl -fsSL "$I" | sudo bash -s -- --release=${tag} --check   # "PREINIT completed successfully this boot", 0 fail`,
                  `btop --version                         # still on PATH`,
                  "```",
                  ``,
                  `### 5. Report and sign off`,
                  `Comment with \`cat /etc/version\`, the step 4 output of \`--check\`, and any tool that failed to run. Sign off here only for a test on ${t.name}.`,
                  `- Works: close this issue as **completed**. That approves [\`${tag}\`](${releaseUrl}) for ${t.name} boxes: promote.yml adds a \`verified-train: ${t.key}\` marker to its notes, and \`get.sh\` then installs it there. The first train to approve a release also makes it a full release and appends the changelog.`,
                  `- Broken: comment what failed, then close as **not planned**. Nothing changes: ${t.name} boxes keep the newest release approved for them. To put that release back on this box: \`curl -fsSL ${inst} | sudo bash\`.`,
                ].join('\n') });
              console.log(`Created ${labelOf(t)} issue for ${tag} on ${t.name}`);
            }
